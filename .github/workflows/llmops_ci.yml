name: LLMOps CI/CD Quality Gate & Evaluation Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  llmops-eval-and-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The quality gate and regression experiment only need the evaluation
      # stack. Installing the full app requirements would pull torch and a
      # multi-gigabyte embedding model for no benefit.
      - name: Install Evaluation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scikit-learn pandas

      - name: Verify Python Modules Compile
        run: |
          python -m py_compile llmops/guardrails.py llmops/semantic_evaluator.py llmops/telemetry.py llmops/retrieval_metrics.py

      - name: Execute LLMOps Automated Guardrail & Evaluation Tests
        run: |
          python llmops/test_quality_gate.py

      - name: Execute Automated Pipeline Regression Quality Gate
        run: |
          python llmops/run_regression_experiment.py
